services:
  db:
    # Same image run.sh uses; includes the pgvector extension
    image: pgvector/pgvector:pg16
    container_name: corvus-db
    environment:
      POSTGRES_DB: corvus
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: corvus
    ports:
      # Postgres listens on 5432 inside the container; host port is 4202
      - "4202:5432"
    volumes:
      - corvus-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d corvus"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: corvus-redis
    ports:
      # 6379 is taken by another project's container on this machine
      - "4203:6379"
    # Working memory for the thought loop is ephemeral by design: no volume,
    # and every thought key carries its own TTL.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  corvus-db-data:
